[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "retinanalysis"
dynamic = ["version"]
description = "An analysis pipeline package for MEA data, created for the Rieke/Manookin lab"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "DRezeanu", email = "DRezeanu@uw.edu" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = [
  "hdf5storage",
  "h5py",
  "statsmodels",
  "progressbar2",
  "Cython",
  "setuptools<81",
  "opencv-python",
  "matplotlib",
  "scikit-learn",
  "pybind11",
  "pandas",
  "seaborn",
  "datajoint==2.2.2",
  "ipywidgets",
  "ipympl",
  "matplotlib_venn",
  "ipykernel",
  "xarray",
  "dask",
  "netCDF4",
  "bottleneck",
  "umap-learn",
  "PyQt5>=5.15.0",
  "pyqtgraph>=0.13.0",
  "QtPy>=2.4.0",
  "hdbscan",
  "scikit-image",
  "platformdirs>=4.9.6",
  "tomlkit>=0.15.1",
]

[project.urls]
Documentation = "https://github.com/DRezeanu/retinanalysis#readme"
Issues = "https://github.com/DRezeanu/retinanalysis/issues"
Source = "https://github.com/DRezeanu/retinanalysis"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "integration: slower tests that exercise multiple package components",
    "downstream: tests that exercise downstream repos dependent on retinanalysis",
]

[tool.hatch.version]
source = "vcs"
